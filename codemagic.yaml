workflows:
  ios-release:
    name: iOS Release (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
    integrations:
      app_store_connect: PCS_ASC_KEY
    environment:
      ios_signing:
        certificates:
          - pcs_distribution
        provisioning_profiles:
          - hastadarpan_appstore_profile
      node: latest
      xcode: latest
      vars:
        APP_STORE_APPLE_ID: 6797386877
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Sync web assets into iOS project
        script: |
          node -v
          npx cap sync ios
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Bump build number
        script: |
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          NEXT_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
          echo "Bumping CFBundleVersion to $NEXT_BUILD_NUMBER (latest on ASC: $LATEST_BUILD_NUMBER)"
          cd ios/App && agvtool new-version -all $NEXT_BUILD_NUMBER
      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
