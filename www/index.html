<script>
/* ================= SHARED HELPERS ================= */
const el=id=>document.getElementById(id);
function toast(m){const t=el('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2300);}
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const ang=(a,b)=>Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI;
function polylineLen(pts){let s=0;for(let i=1;i<pts.length;i++)s+=dist(pts[i-1],pts[i]);return s;}
// curvature: how much a traced line bows away from its straight chord (0 = straight)
function bow(pts){ if(pts.length<3) return 0;
  const a=pts[0],b=pts[pts.length-1],c=dist(a,b); if(c<1) return 0;
  let max=0; for(const p of pts){
    const t=((p.x-a.x)*(b.x-a.x)+(p.y-a.y)*(b.y-a.y))/(c*c);
    const px=a.x+t*(b.x-a.x), py=a.y+t*(b.y-a.y);
    max=Math.max(max,Math.hypot(p.x-px,p.y-py)); }
  return max/c; }
// average local contrast along a traced path = how "deep/clear" the line reads in the photo
function pathContrast(ctx,pts,W,H){
  if(pts.length<2) return 0;
  const img=ctx.getImageData(0,0,W,H).data;
  const lum=(x,y)=>{x=Math.max(0,Math.min(W-1,Math.round(x)));y=Math.max(0,Math.min(H-1,Math.round(y)));
    const i=(y*W+x)*4; return 0.299*img[i]+0.587*img[i+1]+0.114*img[i+2];};
  let sum=0,n=0;
  for(let i=1;i<pts.length;i++){
    const dx=pts[i].x-pts[i-1].x, dy=pts[i].y-pts[i-1].y, L=Math.hypot(dx,dy);
    if(L<1) continue;
    const nx=-dy/L, ny=dx/L;
    for(let s=0;s<=L;s+=3){
      const x=pts[i-1].x+dx*s/L, y=pts[i-1].y+dy*s/L;
      const on=lum(x,y);
      const off=(lum(x+nx*5,y+ny*5)+lum(x-nx*5,y-ny*5))/2;
      sum+=Math.abs(off-on); n++; } }
  return n? sum/n : 0; }
/* ================= IMAGE TRACING STAGE ================= */
function makeStage(container,onReady){
  const wrap=document.createElement('div'); wrap.className='stage';
  const cv=document.createElement('canvas'); wrap.appendChild(cv);
  container.appendChild(wrap);
  const ctx=cv.getContext('2d',{willReadFrequently:true});
  const st={cv,ctx,img:null,W:0,H:0,paths:{},current:null,mode:'draw',pts:[],drawing:false};
  st.load=function(file){
    const fr=new FileReader();
    fr.onload=()=>{ const im=new Image();
      im.onload=()=>{ const maxW=Math.min(520,window.innerWidth-70);
        const sc=Math.min(1,maxW/im.width);
        cv.width=Math.round(im.width*sc); cv.height=Math.round(im.height*sc);
        st.W=cv.width; st.H=cv.height; st.img=im; st.paths={}; st.pts=[];
        st.redraw(); if(onReady) onReady(); };
      im.src=fr.result; };
    fr.readAsDataURL(file); };
  st.redraw=function(){
    if(!st.img) return;
    ctx.clearRect(0,0,st.W,st.H); ctx.drawImage(st.img,0,0,st.W,st.H);
    const COL={life:'#7fbf6a',head:'#f2cd7e',heart:'#d96a5a',fate:'#7ab7d9',sun:'#e0a3f0',marriage:'#ffffff'};
    for(const k in st.paths){ drawPath(st.paths[k],COL[k]||'#d9a441'); }
    if(st.pts.length) drawPath(st.pts,'#ffdf8a',true);
  };
  function drawPath(pts,color,live){
    if(!pts.length) return;
    ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=live?3:2.5; ctx.lineJoin='round'; ctx.lineCap='round';
    ctx.shadowColor='rgba(0,0,0,.7)'; ctx.shadowBlur=3;
    ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y);
    pts.forEach(p=>ctx.lineTo(p.x,p.y)); ctx.stroke();
    if(pts.length<=6){ ctx.fillStyle=color; pts.forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,4,0,7);ctx.fill();}); }
    ctx.restore(); }
  const pos=e=>{ const r=cv.getBoundingClientRect();
    const t=e.touches?e.touches[0]:e;
    return {x:(t.clientX-r.left)*st.W/r.width, y:(t.clientY-r.top)*st.H/r.height}; };
  const start=e=>{ if(!st.img||!st.current) return; e.preventDefault(); st.drawing=true; st.pts=[pos(e)]; st.redraw(); };
  const move=e=>{ if(!st.drawing) return; e.preventDefault();
    const p=pos(e); const last=st.pts[st.pts.length-1];
    if(!last||dist(last,p)>4){ st.pts.push(p); st.redraw(); } };
  const end=e=>{ if(!st.drawing) return; st.drawing=false;
    if(st.pts.length>2){ st.paths[st.current]=st.pts.slice(); }
    st.pts=[]; st.redraw(); if(st.onDone) st.onDone(); };
  cv.addEventListener('mousedown',start); cv.addEventListener('mousemove',move);
  window.addEventListener('mouseup',end);
  cv.addEventListener('touchstart',start,{passive:false}); cv.addEventListener('touchmove',move,{passive:false});
  cv.addEventListener('touchend',end);
  return st; }
/* point-marking stage (for face landmarks) */
function makePointStage(container,onChange){
  const wrap=document.createElement('div'); wrap.className='stage';
  const cv=document.createElement('canvas'); wrap.appendChild(cv);
  container.appendChild(wrap);
  const ctx=cv.getContext('2d',{willReadFrequently:true});
  const st={cv,ctx,img:null,W:0,H:0,points:{},current:null};
  st.load=function(file){ const fr=new FileReader();
    fr.onload=()=>{ const im=new Image();
      im.onload=()=>{ const maxW=Math.min(460,window.innerWidth-70);
        const sc=Math.min(1,maxW/im.width);
        cv.width=Math.round(im.width*sc); cv.height=Math.round(im.height*sc);
        st.W=cv.width; st.H=cv.height; st.img=im; st.points={}; st.redraw(); if(onChange) onChange(); };
      im.src=fr.result; };
    fr.readAsDataURL(file); };
  st.redraw=function(){ if(!st.img) return;
    ctx.clearRect(0,0,st.W,st.H); ctx.drawImage(st.img,0,0,st.W,st.H);
    for(const k in st.points){ const p=st.points[k];
      ctx.save(); ctx.strokeStyle='#f2cd7e'; ctx.fillStyle='rgba(217,164,65,.55)'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(p.x,p.y,6,0,7); ctx.fill(); ctx.stroke();
      ctx.fillStyle='#fff'; ctx.font='10px Georgia'; ctx.shadowColor='#000'; ctx.shadowBlur=4;
      ctx.fillText(k,p.x+9,p.y+3); ctx.restore(); } };
  cv.addEventListener('click',e=>{ if(!st.img||!st.current) return;
    const r=cv.getBoundingClientRect();
    st.points[st.current]={x:(e.clientX-r.left)*st.W/r.width,y:(e.clientY-r.top)*st.H/r.height};
    st.redraw(); if(onChange) onChange(); });
  return st; }
</script>
<script>
/* ================= PALMISTRY ================= */
const PALM_LINES=[
 ['life','Life line','Curves around the base of the thumb, from between thumb and index finger down to the wrist.'],
 ['head','Head line','Runs across the middle of the palm, starting near the life line under the index finger.'],
 ['heart','Heart line','The uppermost long line, running below the fingers from the little-finger side.'],
 ['fate','Fate line','Optional. A vertical line rising from near the wrist towards the middle finger.'],
 ['sun','Sun line','Optional. A short vertical line below the ring finger.'],
 ['marriage','Marriage lines','Optional. Short lines on the edge of the palm below the little finger.']];
const HAND_SHAPES={
 Earth:'Square palm with short fingers — practical, dependable, steady with routine and material matters.',
 Air:'Square palm with long fingers — intellectual, communicative, curious and analytical.',
 Water:'Long palm with long fingers — sensitive, intuitive, imaginative and emotionally attuned.',
 Fire:'Long palm with short fingers — energetic, enterprising, quick to act and lead.'};
function classifyHand(palmW,palmH,fingerLen){
  const longPalm = palmH/palmW > 1.12;
  const longFing = fingerLen/palmH > 0.92;
  if(!longPalm&&!longFing) return 'Earth';
  if(!longPalm&&longFing) return 'Air';
  if(longPalm&&longFing) return 'Water';
  return 'Fire'; }
function palmReading(m){
  // m: measured metrics
  const R={};
  const rel=v=>v/m.palmH; // normalise by palm height
  // ---- Life line
  const lifeLen=rel(m.lifeLen), lifeBow=m.lifeBow;
  R.life={
    len:lifeLen>0.95?'Long':lifeLen>0.65?'Moderate':'Short',
    curve:lifeBow>0.30?'Widely curved':lifeBow>0.17?'Well curved':'Close to the thumb',
    clarity:m.lifeClarity>16?'Deep and clear':m.lifeClarity>8?'Moderately marked':'Fine and faint',
    text:(lifeBow>0.25?'A generously curved life line traditionally indicates strong vitality, warmth and an enthusiasm for living. You draw energy from people and activity. ':
        lifeBow>0.15?'A well-curved life line suggests balanced stamina — you can sustain effort without burning out, provided rest is respected. ':
        'A life line that hugs the thumb suggests energy that is conserved and inward; classical texts read this as caution with over-exertion and a preference for a settled pace. ')
      +(lifeLen>0.95?'Its length speaks of resilience and a constitution that recovers well.':
        lifeLen>0.65?'Its length reads as steady health with attention needed at times of change.':
        'A shorter line is not read as a short life — traditionally it points to energy that comes in focused bursts rather than a constant flow.')
      +(m.lifeClarity>16?' The line is deeply etched, read as robust physical resources.':m.lifeClarity<8?' The line is fine, read as sensitivity to strain and a need for regular rest.':'')};
  // ---- Head line
  const headLen=rel(m.headLen), headSlope=m.headSlope, headBow=m.headBow;
  R.head={
    len:headLen>0.85?'Long':headLen>0.55?'Moderate':'Short',
    slope:headSlope>22?'Sloping downward':headSlope>8?'Gently sloping':'Straight across',
    text:(headSlope>22?'A distinctly sloping head line is the classical mark of an imaginative, creative mind — one that thinks in pictures, stories and possibilities. ':
        headSlope>8?'A gently sloping head line balances practical thinking with imagination; you can plan and dream in equal measure. ':
        'A straight head line indicates a practical, logical and business-like mind that prefers facts and clear structure. ')
      +(headLen>0.85?'Its length shows depth of thought — you like to understand a subject thoroughly before acting.':
        headLen>0.55?'Its moderate length shows a mind that grasps essentials quickly and moves on.':
        'A short head line points to decisive, direct thinking — quick conclusions, little hesitation.')
      +(headBow>0.2?' Its noticeable curve adds versatility and an ability to change approach mid-course.':'')};
  // ---- Heart line
  const heartLen=rel(m.heartLen), heartBow=m.heartBow, heartHigh=m.heartHigh;
  R.heart={
    len:heartLen>0.85?'Long':heartLen>0.55?'Moderate':'Short',
    curve:heartBow>0.18?'Curved and rising':'Fairly straight',
    text:(heartBow>0.18?'A curved, rising heart line is read as warm, expressive affection — you show feeling openly and value demonstrative love. ':
        'A straighter heart line indicates feelings that are deep but privately held; you show love through loyalty and action rather than words. ')
      +(heartLen>0.85?'Its length suggests a generous emotional nature that gives freely, sometimes more than it receives.':
        heartLen>0.55?'Its length suggests a balanced heart — affectionate but self-possessed.':
        'A shorter heart line points to selective attachment: few, but very strong bonds.')},
  // ---- Fate line
  R.fate=m.hasFate?{
    text:(rel(m.fateLen)>0.7?'A long, well-formed fate line is the classical sign of a directed career — a sense of purpose that appears early and holds steady. Work tends to be a central pillar of the life.':
      'A partial fate line suggests a career that finds its direction in stages; the path clarifies with experience rather than being fixed from the start.')
      +(m.fateClarity>16?' Its depth points to strong staying power in professional matters.':'')}:
    {text:'No fate line was traced. Traditionally this is not a negative sign — it indicates a self-directed life where the person makes their own path rather than following an obvious track, often with more freedom and variety in work.'};
  // ---- Sun line
  R.sun=m.hasSun?{text:'The presence of a sun (Apollo) line is read as a capacity for recognition — talent that becomes visible to others. It favours creative, public-facing or reputation-driven work.'}:
    {text:'No sun line was traced, which is very common. Recognition then comes through sustained effort rather than early visibility.'};
  // ---- Marriage
  R.marriage=m.marriageCount>0?{text:'Traced '+m.marriageCount+' union line'+(m.marriageCount>1?'s':'')+'. Classical palmistry reads these as significant bonds and commitments rather than a literal count of marriages; the clearest line indicates the most defining relationship.'}:
    {text:'No union lines were traced — these are often very fine. Read relationship indications from the heart line instead.'};
  // ---- Hand shape
  R.shape={type:m.shapeType,text:HAND_SHAPES[m.shapeType]};
  // ---- Thumb
  R.thumb={angle:Math.round(m.thumbAngle)+'°',
    text:m.thumbAngle>75?'A widely set thumb indicates generosity, openness and an independent, adaptable temperament.':
      m.thumbAngle>50?'A moderately set thumb shows balance between generosity and prudence — open, but not easily swayed.':
      'A closely held thumb indicates carefulness with resources, strong self-control and a private nature.'};
  // ---- Mounts (from marked mount prominence)
  R.mounts=m.mounts||{};
  // ---- Life areas summary
  // area scores: baseline 3, adjusted up or down by what was actually measured
  const clamp=v=>Math.max(1,Math.min(5,Math.round(v)));
  const careerScore=3+(m.hasFate?1:0)+(m.hasSun?0.5:0)+(headSlope<10?0.5:0)+(headLen>0.8?0.5:0)-(headLen<0.5?1:0);
  const relScore=3+(heartBow>0.18?1:0)+(heartLen>0.75?0.5:0)+(m.marriageCount>0?0.5:0)-(heartLen<0.5?1:0);
  const healthScore=3+(lifeBow>0.22?1:0)+(m.lifeClarity>14?0.5:0)+(lifeLen>0.85?0.5:0)-(m.lifeClarity<7?1:0);

function goodLaunchDates(numTarget,fromDate,count){

    d.setDate(d.getDate()+1);
    const dd=d.getDate(), mm=d.getMonth()+1, yy=d.getFullYear();

function nameSpellings(name,target,sys){

  const base=name.trim(); if(!base) return [];
  const variants=new Set();
  const words=base.split(/\s+/);
  const tweaks=[s=>s, s=>s+'a', s=>s+'h', s=>s.replace(/a$/i,'aa'), s=>s.replace(/i$/i,'ee'),
    s=>s.replace(/^([A-Za-z])/,(m)=>m+m.toLowerCase()), s=>s+'e', s=>s.replace(/u/i,'oo')];
  tweaks.forEach(t1=>tweaks.forEach(t2=>{

    if(v!==base&&nameNumber(v,sys)===target) variants.add(v); }));

  return '<div class="metric"><span>'+label+(extra?' <span class="note" style="display:inline">'+extra+'</span>':'')+'</span><b>'+val+(M.k?' — '+M.k:'')+'</b></div>';
}
function doNumerology(){
  const name=el('nName').value.trim(), dob=el('nDOB').value, sys=el('nSys').value;
  if(!name||!dob){ toast('Please enter name and date of birth'); return; }
  const P=numerologyProfile(name,dob,sys);
  const LP=NUM_MEAN[P.lifePath]||NUM_MEAN[reduceNum(P.lifePath)];
  const DE=NUM_MEAN[P.destiny]||NUM_MEAN[reduceNum(P.destiny)];
  const SO=NUM_MEAN[P.soul]||NUM_MEAN[reduceNum(P.soul)];
  let h='<h3 style="margin-top:18px">Core numbers for '+name+'</h3>';
  h+='<div class="grid g2"><div>';
  h+=numCard('Life Path',P.lifePath,'(from date of birth)');
  h+=numCard('Destiny / Expression',P.destiny,'(full name)');
  h+=numCard('Soul Urge',P.soul,'(vowels)');
  h+=numCard('Personality',P.personality,'(consonants)');
  h+=numCard('Birthday',P.birthday);
  h+=numCard('Maturity',P.maturity);
  h+='</div><div>';
  h+='<div class="metric"><span>Personal Year ('+new Date().getFullYear()+')</span><b>'+P.personalYear+'</b></div>';
  h+='<div class="metric"><span>Personal Month</span><b>'+P.personalMonth+'</b></div>';
  h+='<div class="metric"><span>Personal Day (today)</span><b>'+P.personalDay+'</b></div>';
  h+='<div class="metric"><span>Lucky Numbers</span><b>'+(LP.luck||'')+'</b></div>';
  h+='<div class="metric"><span>Lucky Colours</span><b>'+(LP.col||'')+'</b></div>';
  h+='<div class="metric"><span>Favourable Day</span><b>'+(LP.day||'')+'</b></div>';
  h+='</div></div>';
  h+='<h3>What the core numbers say</h3>';
  h+='<p class="readout"><b>Life Path '+P.lifePath+' — '+LP.k+':</b> '+LP.t+'</p>';
  h+='<p class="readout"><b>Destiny '+P.destiny+' — '+DE.k+':</b> Your name directs you towards this expression. '+DE.t+'</p>';
  h+='<p class="readout"><b>Soul Urge '+P.soul+':</b> Inwardly, what you most want is the quality of <b>'+SO.k.replace(/^The /,'')+'</b> — '+SO.t.charAt(0).toLowerCase()+SO.t.slice(1)+'</p>';
  h+='<p class="readout"><b>Maturity '+P.maturity+':</b> From roughly age 35 onward, life increasingly asks you to express this number: '+(NUM_MEAN[P.maturity]||NUM_MEAN[reduceNum(P.maturity)]).t+'</p>';
  h+='<h3>Career &amp; business</h3>';
  h+='<p class="readout"><b>Career tendencies:</b> '+LP.career+'</p>';
  h+='<p class="readout"><b>Business suitability:</b> '+([1,3,5,8,9,22].includes(P.lifePath)?'Your Life Path is well suited to independent enterprise — you have the initiative and drive to run your own venture.':'Your Life Path favours partnership, salaried responsibility or professional practice more than solo enterprise; if you do start a business, take a strong partner for the parts you dislike.')+'</p>';
  h+='<p class="readout"><b>Relationship compatibility:</b> '+LP.rel+'</p>';
  h+='<h3>Personal Year '+P.personalYear+' — '+new Date().getFullYear()+'</h3>';
  h+='<p class="readout">'+YEAR_MEAN[P.personalYear]+'</p>';
  h+='<p class="readout"><b>This month (Personal Month '+P.personalMonth+'):</b> '+YEAR_MEAN[P.personalMonth]+'</p>';
  h+='<h3>Pinnacle cycles</h3><div style="overflow-x:auto"><table><tr><th>Cycle</th><th>Ages</th><th>Number</th><th>Theme</th></tr>';
  P.pinnacles.forEach((pk,i)=>{
    const a=P.pinnacleAges[i], M=NUM_MEAN[pk]||NUM_MEAN[reduceNum(pk)];
    h+='<tr'+(i===P.currentPinnacle?' style="outline:2px solid var(--gold)"':'')+'><td>'+(i+1)+(i===P.currentPinnacle?' (current)':'')+'</td><td>'+a[0]+'–'+a[1]+'</td><td>'+pk+'</td><td>'+M.k+'</td></tr>'; });
  h+='</table></div>';
  h+='<h3>Challenge numbers</h3><div style="overflow-x:auto"><table><tr><th>Challenge</th><th>Number</th><th>Lesson</th></tr>';
  ['First (early life)','Second (middle life)','Main (whole life)','Fourth (later life)'].forEach((n,i)=>{
    h+='<tr><td>'+n+'</td><td>'+P.challenges[i]+'</td><td>'+CHALLENGE_MEAN[P.challenges[i]]+'</td></tr>'; });
  h+='</table></div>';
  h+='<h3>Lucky dates each month</h3><p class="readout">'+luckyDates(P.lifePath).join(', ')+' — these dates resonate with your Life Path number and are traditionally chosen for important beginnings.</p>';
  h+='<h3>Favourable years ahead</h3>';
  const yrs=[]; const nowY=new Date().getFullYear();
  for(let i=0;i<9;i++){ const yy=nowY+i;
    const [by,bm,bd]=dob.split('-').map(Number);
    const py=reduceNum(reduceNum(bd)+reduceNum(bm)+reduceNum(String(yy).split('').reduce((a,c)=>a+ +c,0)));
    if([1,3,5,6,8].includes(py)) yrs.push(yy+' (PY '+py+')'); }
  h+='<p class="readout">'+(yrs.length?yrs.join(' · ')+' are traditionally your more supportive years for new undertakings.':'The coming years favour consolidation over new starts.')+'</p>';
  // name spelling suggestions
  const target=[1,3,5,6].includes(reduceNum(P.lifePath))?reduceNum(P.lifePath):(reduceNum(P.lifePath)===8?6:5);
  const sug=nameSpellings(name,target,sys);
  h+='<h3>Suggested name spellings</h3>';
  h+='<p class="readout">In the '+(sys==='chaldean'?'Chaldean':'Pythagorean')+' system, a name totalling <b>'+target+'</b> would harmonise best with your Life Path '+P.lifePath+'. '
    +(sug.length?'Spellings that reach that total: '+sug.map(s=>'<span class="pill"><b>'+s+'</b></span>').join(' ')
      :'Your present spelling already sits well with your core numbers — no change is indicated.')+'</p>';
  h+='<p class="note">Traditional practice treats a name change as a slow act — used consistently in signature and daily use for it to take effect. Legal name changes are a personal decision.</p>';
  // optional extras
  const mob=el('nMobile').value.trim();
  if(mob){ const a=numberAnalysis(mob);
    h+='<h3>Your mobile number</h3><p class="readout">Digits total <b>'+a.total+'</b>, reducing to <b>'+a.root+'</b>. '+MOBILE_MEAN[a.root]
      +' '+(compatibility(a.root,P.lifePath).score>=70?'It harmonises well with your Life Path '+P.lifePath+'.':'It pulls in a different direction from your Life Path '+P.lifePath+'; a number reducing to '+reduceNum(P.lifePath)+' or '+reduceNum(P.lifePath+2)+' would suit you better.')+'</p>'; }
  const biz=el('nBiz').value.trim();
  if(biz){ const bn=nameNumber(biz,sys);
    const c=compatibility(bn,P.lifePath);
    h+='<h3>Business name: '+biz+'</h3><p class="readout">Name number <b>'+bn+' — '+(NUM_MEAN[bn]||NUM_MEAN[reduceNum(bn)]).k+'</b>. '
      +(NUM_MEAN[bn]||NUM_MEAN[reduceNum(bn)]).t+' Compatibility with your Life Path: <b>'+c.score+'% — '+c.verdict+'</b>. '
      +'Traditionally, business names reducing to 1, 3, 5, 6, 8 or 9 are favoured for trade; 6 and 9 for service, 8 for finance and industry, 5 for sales and trading.</p>'; }
  const inc=el('nInc').value;
  if(inc){ const [iy,im,id]=inc.split('-').map(Number);
    const isum=reduceNum(reduceNum(id)+reduceNum(im)+reduceNum(String(iy).split('').reduce((a,c)=>a+ +c,0)));
    h+='<h3>Company incorporation date</h3><p class="readout">The date '+new Date(inc).toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'})
      +' carries the number <b>'+isum+' — '+(NUM_MEAN[isum]||NUM_MEAN[reduceNum(isum)]).k+'</b>. '+YEAR_MEAN[isum]+'</p>'; }
  h+='<div style="margin-top:14px"><button class="small ghost" onclick="window.JyotishBridge?JyotishBridge.printPage():window.print()">🖨 Print / Save PDF</button></div>';
  el('numOut').innerHTML=h;
  if(window.collectNumFindings){ collectNumFindings(P,name); renderUpayTab(); }
  el('numOut').scrollIntoView({behavior:'smooth',block:'start'});
}

function runCompat(){
  const n1=el('c1n').value.trim(), n2=el('c2n').value.trim(), d1=el('c1d').value, d2=el('c2d').value;
  const sys=el('tSys').value;
  if(!n1||!n2){ toast('Enter both names'); return; }
  const nn1=nameNumber(n1,sys), nn2=nameNumber(n2,sys);
  const nameC=compatibility(nn1,nn2);
  let h='<h3 style="margin-top:16px">Result</h3>';
  h+='<div class="metric"><span>'+n1+' — name number</span><b>'+nn1+' ('+(NUM_MEAN[nn1]||NUM_MEAN[reduceNum(nn1)]).k+')</b></div>';
  h+='<div class="metric"><span>'+n2+' — name number</span><b>'+nn2+' ('+(NUM_MEAN[nn2]||NUM_MEAN[reduceNum(nn2)]).k+')</b></div>';
  h+='<div class="metric"><span>Name compatibility</span><b>'+nameC.score+'% — '+nameC.verdict+'</b></div>';
  if(d1&&d2){
    const p1=numerologyProfile(n1,d1,sys), p2=numerologyProfile(n2,d2,sys);
    const lpC=compatibility(p1.lifePath,p2.lifePath);
    h+='<div class="metric"><span>Life Path numbers</span><b>'+p1.lifePath+' &amp; '+p2.lifePath+'</b></div>';
    h+='<div class="metric"><span>Life Path compatibility</span><b>'+lpC.score+'% — '+lpC.verdict+'</b></div>';
    const overall=Math.round((nameC.score+lpC.score*1.5)/2.5);
    h+='<div class="metric"><span>Overall</span><b>'+overall+'%</b></div>';
    h+='<p class="readout">'+(overall>=80?'A strongly harmonious pairing. Your natural rhythms support each other, and differences tend to be complementary rather than divisive.':
      overall>=65?'A workable and generally happy pairing. Where you differ, conscious communication settles matters quickly.':
      'A pairing that asks for effort. The numbers pull in different directions, so give each other room for your different paces — many long marriages sit here.')+'</p>';
    h+='<p class="readout"><b>'+n1+'</b> is a '+(NUM_MEAN[p1.lifePath]||NUM_MEAN[reduceNum(p1.lifePath)]).k+' — '+(NUM_MEAN[p1.lifePath]||NUM_MEAN[reduceNum(p1.lifePath)]).rel+'</p>';
    h+='<p class="readout"><b>'+n2+'</b> is a '+(NUM_MEAN[p2.lifePath]||NUM_MEAN[reduceNum(p2.lifePath)]).k+' — '+(NUM_MEAN[p2.lifePath]||NUM_MEAN[reduceNum(p2.lifePath)]).rel+'</p>';
  }

}
function runBaby(){
  const dob=el('bDOB').value, sex=el('bSex').value, sys=el('tSys').value;
  if(!dob){ toast('Enter the date of birth'); return; }
  const [y,m,d]=dob.split('-').map(Number);
  const lp=reduceNum(reduceNum(d)+reduceNum(m)+reduceNum(String(y).split('').reduce((a,c)=>a+ +c,0)));
  const good=[lp,reduceNum(lp+2),reduceNum(lp+4)].filter((v,i,a)=>a.indexOf(v)===i&&v>0);
  let h='<h3 style="margin-top:16px">For a child born '+new Date(dob).toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'})+'</h3>';
  h+='<p class="readout">Life Path number <b>'+lp+' — '+(NUM_MEAN[lp]||NUM_MEAN[reduceNum(lp)]).k+'</b>. '+(NUM_MEAN[lp]||NUM_MEAN[reduceNum(lp)]).t+'</p>';
  h+='<p class="readout">Traditionally, a name whose number totals <b>'+good.join(', ')+'</b> harmonises with this Life Path.</p>';
  h+='<div style="overflow-x:auto"><table><tr><th>Name</th><th>Name number</th><th>Quality</th></tr>';
  const seen=new Set();
  good.forEach(g=>{ (BABY_NAMES[reduceNum(g)]||{})[sex==='M'?'M':'F']?.forEach(n=>{
    if(seen.has(n)) return; seen.add(n);
    const nn=nameNumber(n,sys);

  h+='</table></div>';

}

function runLaunch(){

  if(!dob){ toast('Enter the owner’s date of birth'); return; }
  const [y,m,d]=dob.split('-').map(Number);
  const lp=reduceNum(reduceNum(d)+reduceNum(m)+reduceNum(String(y).split('').reduce((a,c)=>a+ +c,0)));
  const bn=name?nameNumber(name,sys):lp;
  const target=[1,3,5,6,8,9].includes(reduceNum(bn))?reduceNum(bn):reduceNum(lp);

  h+='<div class="metric"><span>Target day number</span><b>'+target+'</b></div>';
  h+='<div style="overflow-x:auto;margin-top:10px"><table><tr><th>Date</th><th>Day</th><th>Full date number</th><th>Date-of-month number</th></tr>';

  h+='<p class="note">These dates carry a number in harmony with the business name and owner. For a full muhurat, also check the panchang (tithi, nakshatra) for the chosen day.</p>';
  el('toolOut').innerHTML=h;
}

}

function addFinding(f){ // {key,title:[en,hi],sev,why:[en,hi],fix:[...]}
  window.UPAY_FINDINGS=window.UPAY_FINDINGS.filter(x=>x.key!==f.key);
  window.UPAY_FINDINGS.push(f);
}
function renderUpayTab(){
  const list=window.UPAY_FINDINGS||[];
  let h='<div class="card"><h2>'+L(UI.upayTitle[0],UI.upayTitle[1])+'</h2>';
  h+='<p class="note">'+L(UI.upayIntro[0],UI.upayIntro[1])+'</p>';
  if(!list.length) h+='<p class="readout" style="margin-top:12px">'+L(UI.nothing[0],UI.nothing[1])+'</p>';
  list.forEach(item=>{
    h+='<div class="remedy-card"><h4>⚠️ '+L(item.title[0],item.title[1])
      +'<span class="sev '+item.sev+'">'+L(UI.severity[item.sev][0],UI.severity[item.sev][1])+'</span></h4>';
    h+='<div class="why">'+L(item.why[0],item.why[1])+'</div>';
    item.fix.forEach(f=>{ h+='<div class="upay-row"><span class="ic">'+f[0]+'</span><span class="tx">'+L(f[1][0],f[1][1])+'</span></div>'; });
    h+='</div>';
  });
  h+='<h3>'+L(UI.general[0],UI.general[1])+'</h3><div class="remedy-card">';
  GENERAL_UPAY.forEach(g=>{ h+='<div class="upay-row"><span class="ic">'+g[0]+'</span><span class="tx">'+L(g[1][0],g[1][1])+'</span></div>'; });
  h+='</div>';
  h+='<p class="note">'+L('These are traditional practices offered for faith and self-discipline, not professional advice. For medical, legal or financial problems please consult a qualified professional.',
    'ये पारंपरिक उपाय श्रद्धा और आत्म-अनुशासन हेतु हैं, पेशेवर सलाह नहीं। चिकित्सा, कानूनी या आर्थिक समस्या के लिए योग्य विशेषज्ञ से परामर्श लें।')+'</p>';
  h+='<div style="margin-top:12px"><button class="small ghost" onclick="window.JyotishBridge?JyotishBridge.printPage():window.print()">'+L(UI.print[0],UI.print[1])+'</button></div></div>';
  el('pane-upay').innerHTML=h;
}

         'अंक 4, 7 और 8 भाग्य से नहीं, निरंतर परिश्रम से फल देते हैं। परंपरा में इन्हें अनुशासन और सेवा से बल मिलता है।'],
    fix:planetFix(NUM_PLANET[reduceNum(P.lifePath)]||'Saturn')});
  const c=compatibility(reduceNum(P.destiny),reduceNum(P.lifePath));
  if(c.score<70) addFinding({key:'namefit',sev:'med',
    title:['Your name number and Life Path pull differently ('+c.score+'%)','आपका नाम अंक और जीवन पथ भिन्न दिशा में ('+c.score+'%)'],
    why:['The name you use totals '+P.destiny+' while your Life Path is '+P.lifePath+'. Numerology reads this as effort not always matching natural talent.',
         'आपका प्रयुक्त नाम '+P.destiny+' बनता है जबकि जीवन पथ '+P.lifePath+' है। अंकशास्त्र इसे परिश्रम और स्वाभाविक प्रतिभा के बीच अंतर मानता है।'],
    fix:[['✍️',['See the suggested spellings in the Numerology tab; use the chosen spelling consistently in signature and daily life.','अंकशास्त्र टैब में सुझाई वर्तनी देखें; चुनी गई वर्तनी हस्ताक्षर और दैनिक प्रयोग में लगातार अपनाएं।']]].concat(planetFix(NUM_PLANET[reduceNum(P.lifePath)]||'Jupiter'))});
}
/* ================= BACK BUTTON + LANG ================= */
let TAB_HISTORY=[];
function showTab(t,record){
  if(record!==false){ const cur=document.querySelector('#tabBar button.active');
    if(cur&&cur.dataset.t!==t) TAB_HISTORY.push(cur.dataset.t); }
  document.querySelectorAll('#tabBar button').forEach(x=>x.classList.toggle('active',x.dataset.t===t));
  document.querySelectorAll('.tabpane').forEach(x=>x.classList.toggle('show',x.id==='pane-'+t));
  el('backBtn').style.display=TAB_HISTORY.length?'inline-block':'none';
  window.scrollTo({top:0,behavior:'smooth'});
}
function goBack(){
  if(!TAB_HISTORY.length) return false;
  showTab(TAB_HISTORY.pop(),false);
  el('backBtn').style.display=TAB_HISTORY.length?'inline-block':'none';
  return true;
}
window.appGoBack=goBack;
function setLang(l){
  LANG=l;
  el('langEN').classList.toggle('on',l==='en');
  el('langHI').classList.toggle('on',l==='hi');
  el('appTitle').textContent=L(UI.title[0],UI.title[1]);
  el('appTag').textContent=L(UI.tag[0],UI.tag[1]);
  el('backLbl').textContent=L(UI.back[0],UI.back[1]);
  document.querySelectorAll('#tabBar button').forEach(b=>{
    const k=UI.tabs[b.dataset.t]; if(k) b.textContent=L(k[0],k[1]); });
  // rebuild the palm tab so its hand labels/notes follow the language,
  // keeping whatever the user already selected
  const active=document.querySelector('#tabBar button.active');
  const hadPalm=palmStage&&palmStage.img;
  if(!hadPalm) renderPalmTab();
  else updateHandNote();
  renderUpayTab();
  if(active) showTab(active.dataset.t,false);
}
/* ================= INIT ================= */
document.querySelectorAll('#tabBar button').forEach(b=>b.onclick=()=>showTab(b.dataset.t));
renderPalmTab(); renderFaceTab(); renderNumTab(); renderToolsTab(); renderAboutTab(); renderUpayTab();
</script>
